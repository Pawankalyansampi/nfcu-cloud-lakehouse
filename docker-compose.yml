services:
  api:
    build: .
    command: python docker_api.py
    env_file:
      - .env
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
      - nfcu-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s

  dashboard:
    build: .
    command: python -m streamlit run app/dashboard.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    env_file:
      - .env
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
      - nfcu-data:/app/data
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.10.5
    depends_on:
      api:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      NFCU_API: http://api:8000
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname NFCU --lastname Admin --role Admin --email admin@example.com || true
        airflow scheduler &
        exec airflow webserver --port 8080
    ports:
      - "8080:8080"

  stream:
    build: .
    profiles: ["stream"]
    command: python scripts/stream_payments.py --seconds 20
    env_file:
      - .env
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro

volumes:
  nfcu-data:
